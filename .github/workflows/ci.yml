name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (referee-engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: referee-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: referee-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          # 确保鉴权不会被任何残留 CI 变量意外启用
          REFEREE_API_KEY: ''
          CORS_ORIGINS: ''
        run: pytest tests/unit -q --no-header

  target-image:
    name: Target image tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: target-image/ctf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install minimal deps
        run: pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -q --no-header

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build